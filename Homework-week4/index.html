<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Website title -->
        <title>Student Practice Webpage</title>
    
        <!-- Connect CSS file -->
        <link rel="stylesheet" href="css/style.css">
    
        <!-- Favicon -->
        <link rel="icon" href="images/my-logo.png">
    
    </head>
    
    <body>
    
        <!-- Top blue header -->
        <div class="header">
    
            <h1>Student Practice Webpage</h1>
    
            <p>HTML + CSS Practice (Forms + Table Advanced)</p>
    
        </div>
    
    
        <!-- Image Section -->
        <div class="box">
    
            <h2>Image Section</h2>
    
            <img src="images/stormy-ocean-waves.webp" class="normal-image">
    
        </div>
    
    
    
        <!-- Circle Image -->
        <div class="box">
    
            <h2>Image Circle</h2>
    
            <img src="images/stormy-ocean-waves.webp" class="circle-image">
    
        </div>
    
    
    
        <!-- Oval Image -->
        <div class="box">
    
            <h2>Image Oval</h2>
    
            <img src="images/stormy-ocean-waves.webp" class="oval-image">
    
        </div>
    
    
    
        <!-- Table Section -->
        <div class="box">
    
            <h2>Advanced Table</h2>
    
            <table>
    
                <!-- First row -->
                <tr>
                    <th rowspan="2">Name</th>
                    <th colspan="2">Scores</th>
                    <th rowspan="2">Grade</th>
                </tr>
    
                <!-- Second row -->
                <tr>
                    <th>Math</th>
                    <th>CS</th>
                </tr>
    
                <!-- Student 1 -->
                <tr>
                    <td>Alice</td>
                    <td>90</td>
                    <td>95</td>
                    <td>A</td>
                </tr>
    
                <!-- Student 2 -->
                <tr>
                    <td>Bob</td>
                    <td>80</td>
                    <td>85</td>
                    <td>B</td>
                </tr>
    
            </table>
    
        </div>
    
    
    
        <!-- Form 1 -->
        <div class="box form-box">
    
            <h2>Form 1: Basic Info</h2>
    
            <form>
    
                <!-- Name -->
                <div class="input-box">
    
                    <label>Name *</label>
    
                    <input type="text">
    
                </div>
    
    
                <!-- Email -->
                <div class="input-box">
    
                    <label>Email *</label>
    
                    <input type="email">
    
                </div>
    
    
                <!-- Password -->
                <div class="input-box">
    
                    <label>Password *</label>
    
                    <input type="password">
    
                </div>
    
    
                <!-- Upload -->
                <div class="input-box">
    
                    <label>Upload File</label>
    
                    <input type="file">
    
                </div>
    
    
                <!-- Buttons -->
                <button type="submit">Submit</button>
    
                <button type="reset">Reset</button>
    
            </form>
    
        </div>
    
    
    
        <!-- Form 2 -->
        <div class="box form-box">
    
            <h2>Form 2: Survey Form</h2>
    
            <form>
    
                <!-- Course -->
                <div class="input-box">
    
                    <label>Choose Course *</label>
    
                    <select>
    
                        <option>-- Select --</option>
    
                        <option>Web Development</option>
    
                        <option>Database</option>
    
                        <option>Networking</option>
    
                    </select>
    
                </div>
    
    
    
                <!-- Gender -->
                <div class="input-box">
    
                    <label>Gender</label>
    
                    <input type="radio" name="gender"> Male
    
                    <input type="radio" name="gender"> Female
    
                </div>
    
    
    
                <!-- Skills -->
                <div class="input-box">
    
                    <label>Skills</label>
    
                    <input type="checkbox"> HTML
    
                    <input type="checkbox"> CSS
    
                    <input type="checkbox"> JS
    
                </div>
    
    
    
                <!-- Phone -->
                <div class="input-box">
    
                    <label>Phone *</label>
    
                    <input type="text">
    
                </div>
    
    
    
                <!-- Message -->
                <div class="input-box">
    
                    <label>Message</label>
    
                    <textarea></textarea>
    
                </div>
    
    
                <!-- Send button -->
                <button type="submit">Send</button>
    
            </form>
    
        </div>
    
    </body>
    
    </html>
